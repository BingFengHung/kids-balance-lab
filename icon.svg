<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e1045" />
      <stop offset="100%" stop-color="#070312" />
    </radialGradient>
    <linearGradient id="beam-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff007f" />
      <stop offset="50%" stop-color="#ff00ff" />
      <stop offset="100%" stop-color="#ff007f" />
    </linearGradient>
    <linearGradient id="base-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#0072ff" />
    </linearGradient>
    <filter id="neon-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bg-glow)" rx="96" />
  
  <!-- Scale fulcrum -->
  <polygon points="256,210 210,390 302,390" fill="url(#base-grad)" filter="url(#neon-glow)" />
  <circle cx="256" cy="210" r="18" fill="#ffffff" filter="url(#neon-glow)" />
  
  <!-- Base Stand -->
  <rect x="146" y="390" width="220" height="24" rx="12" fill="url(#base-grad)" filter="url(#neon-glow)" />
  
  <!-- Balanced Beam -->
  <g>
    <rect x="76" y="198" width="360" height="24" rx="12" fill="url(#beam-grad)" filter="url(#neon-glow)" />
    
    <!-- Left Hook -->
    <path d="M 126 222 L 126 280 A 20 20 0 1 1 106 260" fill="none" stroke="#00f0ff" stroke-width="6" stroke-linecap="round" filter="url(#neon-glow)" />
    <!-- Right Hook -->
    <path d="M 386 222 L 386 280 A 20 20 0 1 0 406 260" fill="none" stroke="#ff007f" stroke-width="6" stroke-linecap="round" filter="url(#neon-glow)" />
    
    <!-- Cute balancing weights (Emojis stylized) -->
    <!-- Left Weight (Rabbit blue theme) -->
    <circle cx="106" cy="290" r="22" fill="#0d061f" stroke="#00f0ff" stroke-width="4" filter="url(#neon-glow)" />
    <text x="106" y="297" font-size="24" text-anchor="middle" font-family="sans-serif">🐰</text>
    
    <!-- Right Weight (Fox orange theme) -->
    <circle cx="406" cy="290" r="22" fill="#0d061f" stroke="#ff007f" stroke-width="4" filter="url(#neon-glow)" />
    <text x="406" y="297" font-size="24" text-anchor="middle" font-family="sans-serif">🦊</text>
  </g>
</svg>
